[project]
name = "mcp-lang-chain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HITSADDA", email = "gamingwood18@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddg>=0.2.2",
    "ddgs>=9.16.1",
    "duckduckgo-search>=8.1.1",
    "ipykernel>=7.4.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.22",
    "langgraph-cli[inmem]>=0.4.43",
    "mcp>=1.30.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
mcp-lang-chain = "mcp_lang_chain:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
